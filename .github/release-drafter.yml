name-template: "RootScope $RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
version-template: "v$MAJOR.$MINOR.$PATCH"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
categories:
  - title: "Breaking changes"
    labels: [breaking]
  - title: "Edge AI and models"
    labels: [ai, model, bpu]
  - title: "Firmware and hardware"
    labels: [firmware, hardware]
  - title: "Documentation and evidence"
    labels: [documentation, evidence]
  - title: "Security and release engineering"
    labels: [security, dependencies, release]
  - title: "Other changes"
    labels: ["*", "!skip-changelog"]
exclude-labels: [skip-changelog]
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [bug, documentation, dependencies, security]
  default: patch
template: |
  ## RootScope release

  This release is part of the complete-source and reproducibility edition of
  the AdventureX 2026 D-Robotics track Silver Award / final second-place
  project.

  $CHANGES

  ## Integrity and provenance

  Verify downloaded files against `SHA256SUMS` and the published GitHub
  artifact attestation. Read `SECURITY.md`, `LICENSE_MATRIX.md` and
  `THIRD_PARTY_NOTICES.md` before operating any physical hardware.
