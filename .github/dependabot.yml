version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # The release verifier is intentionally validated against OpenCV 4.x.
      # A major upgrade must update the X5 runtime, exact wheel manifest, and
      # vision contracts together in a dedicated compatibility change.
      - dependency-name: opencv-python-headless
        update-types: [version-update:semver-major]
    groups:
      python-development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /software/rdk-x5
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # OpenCV 5 currently breaks the frozen portable control contracts.
      # Keep receiving 4.x fixes, but require an explicit compatibility PR
      # before lifting the validated major-version boundary.
      - dependency-name: opencv-python-headless
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Major action upgrades change runner/runtime contracts and are reviewed
      # as dedicated human-authored supply-chain changes.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      github-actions:
        patterns: ["*"]
