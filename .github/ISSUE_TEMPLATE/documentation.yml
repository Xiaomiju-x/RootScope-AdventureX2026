name: Documentation / 文档问题
description: Report an unclear, incorrect, outdated, or missing explanation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page and section
      placeholder: docs/ARCHITECTURE.md — Authority matrix
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed correction
      description: Include evidence/source if changing a technical or award claim.
    validations:
      required: true
  - type: checkboxes
    id: truth
    attributes:
      label: Truth boundary
      options:
        - label: This report contains no credentials, device identity, private paths, or unlicensed media.
          required: true
        - label: I distinguished fixed-card, replay, BPU, and physical evidence where relevant.
          required: true
