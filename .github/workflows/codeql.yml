name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 2 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python and C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build C host harness for CodeQL
        if: matrix.language == 'c-cpp'
        working-directory: firmware/stm32f103-v15
        run: >-
          gcc -std=c11 -ITests/mock -ICore/Inc
          Core/Src/stepper.c Core/Src/app.c Tests/test_app.c
          -o /tmp/rootscope-stm32-codeql
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
