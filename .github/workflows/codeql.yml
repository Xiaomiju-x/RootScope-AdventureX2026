name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 2 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python and C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Build C host harness for CodeQL
        if: matrix.language == 'c-cpp'
        working-directory: firmware/stm32f103-v15
        run: >-
          gcc -std=c11 -ITests/mock -ICore/Inc
          Core/Src/stepper.c Core/Src/app.c Tests/test_app.c
          -o /tmp/rootscope-stm32-codeql
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: /language:${{ matrix.language }}
