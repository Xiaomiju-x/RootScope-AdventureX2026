name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  publication-audit:
    name: Publication audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history and LFS assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify Git LFS materialization
        run: git lfs fsck
      - name: Scan current tree and all Git history
        run: python tools/audit_public_release.py --include-git-history
      - name: Verify model manifest and content digests
        run: python tools/verify_model_assets.py
      - name: Verify licence inventory
        run: python tools/check_license_inventory.py

  python-reference:
    name: Python ${{ matrix.python-version }} reference tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install public reference package
        run: python -m pip install -e ".[dev]"
      - name: Run public contract and governance tests
        run: python -m pytest -q tests

  software-contracts:
    name: RDK X5 and research contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install portable RDK X5 test dependencies
        run: python -m pip install -e "software/rdk-x5[hardware,test]"
      - name: Run research, RAG2 and evaluation contracts
        env:
          PYTHONPATH: research
        run: >-
          python -m pytest -q
          research/rootscope_v3/tests
          research/rootscope_v3/rag2/tests
          research/rootscope_v3/evaluations/test_rootsight_delta.py
      - name: Run portable control and fail-safe contracts
        env:
          PYTHONPATH: software/rdk-x5
        run: >-
          python -m pytest -q
          software/rdk-x5/tests/test_probe_depth.py
          software/rdk-x5/tests/test_state_machine.py
          software/rdk-x5/tests/test_serial_frame.py
          software/rdk-x5/tests/test_read_only_explainer.py
          software/rdk-x5/tests/test_competition_llm.py
          software/rdk-x5/tests/test_card_geometric_matcher.py
          software/rdk-x5/tests/test_visual_irrigation_autopilot.py
          software/rdk-x5/tests/test_visual_irrigation_kiosk.py
          software/rdk-x5/tests/test_visual_irrigation_serial_reliability.py

  stm32-host-tests:
    name: STM32 fail-safe host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile host-side firmware logic with warnings as errors
        working-directory: firmware/stm32f103-v15
        run: >-
          gcc -std=c11 -Wall -Wextra -Werror
          -ITests/mock -ICore/Inc
          Core/Src/stepper.c Core/Src/app.c Tests/test_app.c
          -o /tmp/rootscope-stm32-host-tests
      - name: Run host-side firmware logic tests
        run: /tmp/rootscope-stm32-host-tests

  release-dry-run:
    name: Deterministic release dry run
    needs: [publication-audit, python-reference, software-contracts, stm32-host-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build source, evidence and checksum manifests
        run: python tools/build_release_bundle.py --output dist --version ci-${GITHUB_SHA::12}
      - name: Verify release bundle
        run: python tools/verify_release_bundle.py dist
      - name: Upload dry-run bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rootscope-release-dry-run-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
