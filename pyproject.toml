[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootscope-public"
version = "1.0.1"
description = "Complete reproducible source for the AdventureX 2026 D-Robotics Silver Award and 2nd Place RootScope irrigation chamber"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RootScope Team"}]
keywords = ["adventurex2026", "rdk-x5", "edge-ai", "embodied-ai", "irrigation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
rootscope-public = "rootscope_public.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
