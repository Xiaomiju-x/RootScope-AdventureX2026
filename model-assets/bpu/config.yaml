# Generation-2 predeclared single fallback. See generation2_plan.json.
model_parameters:
  onnx_model: './rootscope_seed17_resnet18_static_b1x3x224x224_opset11.onnx'
  march: 'bayes-e'
  layer_out_dump: False
  working_dir: './model_output'
  output_model_file_prefix: 'rootscope_seed17_resnet18_224x224_rgb_ddr_r7_default_int16_all_nodes'
  log_level: 'debug'

input_parameters:
  input_name: 'image'
  input_type_rt: 'rgb'
  input_layout_rt: 'NCHW'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  input_shape: '1x3x224x224'
  norm_type: 'data_mean_and_scale'
  mean_value: '123.675 116.28 103.53'
  scale_value: '0.01712475 0.017507 0.01742919'

calibration_parameters:
  cal_data_dir: './calibration_data_rgb_f32'
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: 'set_all_nodes_int16'

compiler_parameters:
  compile_mode: 'latency'
  debug: False
  optimize_level: 'O3'
  core_num: 1
  input_source: {'image': 'ddr'}
