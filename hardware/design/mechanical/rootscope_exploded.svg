<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>RootScope 固定式根区灌溉舱爆炸装配图</title>
  <desc>P0 三个独立微型蠕动泵、三层固定出水沙芯的机械总成分解与装配顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#34495e"/>
    </marker>
    <pattern id="sand" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e9cf9d"/>
      <circle cx="3" cy="4" r="1.2" fill="#b78b52"/>
      <circle cx="10" cy="9" r="1" fill="#c59a5c"/>
    </pattern>
    <style><![CDATA[
      text { font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill:#172334; }
      .title { font-size:28px; font-weight:700; }
      .subtitle { font-size:15px; fill:#506176; }
      .section { font-size:18px; font-weight:700; }
      .label { font-size:14px; font-weight:600; }
      .small { font-size:12px; }
      .tiny { font-size:10px; }
      .frame { stroke:#33485e; stroke-width:6; fill:none; }
      .rear { stroke:#8796a6; stroke-width:4; fill:none; }
      .join { stroke:#64778a; stroke-width:3; fill:none; }
      .explode { stroke:#34495e; stroke-width:2; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .wet { fill:#d7f1f4; stroke:#16869b; stroke-width:2; }
      .dry { fill:#fff0d7; stroke:#c27918; stroke-width:2; }
      .optical { fill:#e9e0fa; stroke:#6947a8; stroke-width:2; }
      .panel { fill:#f7fafc; stroke:#718096; stroke-width:2; }
      .callout { fill:white; stroke:#c3ccd7; stroke-width:1.3; rx:7; }
      .num { fill:#172334; stroke:white; stroke-width:2; }
      .numtext { fill:#ffffff !important; font-size:12px; font-weight:700; text-anchor:middle; }
      .port1 { fill:#2f80ed; stroke:#143f78; stroke-width:1.5; }
      .port2 { fill:#f2c94c; stroke:#80691d; stroke-width:1.5; }
      .port3 { fill:#eb5757; stroke:#7d2222; stroke-width:1.5; }
    ]]></style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <text x="40" y="48" class="title">RootScope 固定式根区灌溉舱｜P0 爆炸装配图</text>
  <text x="40" y="78" class="subtitle">装配方向：先框架和隔舱，再湿区，再光学与干区。三台微型蠕动泵分别连接 L1/L2/L3；水路不得穿越隔舱板。</text>

  <rect x="30" y="100" width="1180" height="820" fill="#ffffff" stroke="#d6dde7" stroke-width="2" rx="10"/>

  <!-- final frame in perspective -->
  <g id="frame-final">
    <rect x="650" y="220" width="500" height="520" class="frame"/>
    <rect x="715" y="175" width="500" height="520" class="rear"/>
    <line x1="650" y1="220" x2="715" y2="175" class="join"/>
    <line x1="1150" y1="220" x2="1215" y2="175" class="join"/>
    <line x1="1150" y1="740" x2="1215" y2="695" class="join"/>
    <line x1="650" y1="740" x2="715" y2="695" class="join"/>
    <line x1="982" y1="220" x2="982" y2="740" stroke="#33485e" stroke-width="12"/>
    <line x1="1047" y1="175" x2="1047" y2="695" stroke="#8796a6" stroke-width="9"/>
    <line x1="982" y1="220" x2="1047" y2="175" class="join"/>
    <line x1="982" y1="740" x2="1047" y2="695" class="join"/>
    <text x="900" y="715" class="small" text-anchor="middle">湿区</text>
    <text x="1068" y="715" class="small" text-anchor="middle">干区</text>
  </g>

  <!-- 01 frame badge -->
  <circle cx="1185" cy="205" r="17" class="num"/>
  <text x="1185" y="210" class="numtext">01</text>
  <text x="1100" y="145" class="label">A10 2020 主机架</text>

  <!-- 02 spill tray exploded -->
  <g id="tray">
    <path d="M90,735 L410,735 L455,708 L135,708 Z" class="wet"/>
    <path d="M90,735 L410,735 L410,775 L90,775 Z" fill="#b9e4ea" stroke="#16869b" stroke-width="2"/>
    <path d="M410,735 L455,708 L455,748 L410,775 Z" fill="#9bcfd7" stroke="#16869b" stroke-width="2"/>
    <circle cx="380" cy="748" r="10" fill="#f8d7da" stroke="#bd3030" stroke-width="2"/>
    <text x="250" y="800" class="label" text-anchor="middle">02｜A21 接水盘 + 漏水片</text>
  </g>
  <line x1="455" y1="748" x2="695" y2="680" class="explode"/>

  <!-- 03 wet slide exploded -->
  <g id="wet-slide">
    <path d="M95,520 L430,520 L470,495 L135,495 Z" class="wet"/>
    <path d="M95,520 L430,520 L430,620 L95,620 Z" fill="#e8f8fa" stroke="#16869b" stroke-width="2"/>
    <ellipse cx="170" cy="515" rx="48" ry="18" fill="#8fcdd5" stroke="#16869b" stroke-width="2"/>
    <rect x="122" y="515" width="96" height="76" fill="#b9e4ea" stroke="#16869b" stroke-width="2"/>
    <ellipse cx="170" cy="591" rx="48" ry="18" fill="#a9dae0" stroke="#16869b" stroke-width="2"/>
    <text x="170" y="554" class="small" text-anchor="middle">0.5 L 水箱</text>
    <text x="170" y="573" class="tiny" text-anchor="middle">称重片独立承载</text>
    <g>
      <rect x="250" y="518" width="58" height="28" class="wet" rx="5"/>
      <rect x="250" y="553" width="58" height="28" class="wet" rx="5"/>
      <rect x="250" y="588" width="58" height="28" class="wet" rx="5"/>
      <text x="279" y="537" class="tiny" text-anchor="middle">PUMP_L1</text>
      <text x="279" y="572" class="tiny" text-anchor="middle">PUMP_L2</text>
      <text x="279" y="607" class="tiny" text-anchor="middle">PUMP_L3</text>
    </g>
    <path d="M308,532 C340,532 340,515 365,515" fill="none" stroke="#2f80ed" stroke-width="4"/>
    <path d="M308,567 C340,567 340,550 365,550" fill="none" stroke="#f2c94c" stroke-width="4"/>
    <path d="M308,602 C340,602 340,585 365,585" fill="none" stroke="#eb5757" stroke-width="4"/>
    <circle cx="375" cy="515" r="7" class="port1"/>
    <circle cx="375" cy="550" r="7" class="port2"/>
    <circle cx="375" cy="585" r="7" class="port3"/>
    <text x="250" y="650" class="label" text-anchor="middle">03｜A24 三泵水路滑板</text>
  </g>
  <line x1="470" y1="565" x2="755" y2="595" class="explode"/>

  <!-- 04 cradle -->
  <g id="cradle">
    <path d="M390,695 L580,695 L610,677 L420,677 Z" fill="#e2e8f0" stroke="#52657a" stroke-width="2"/>
    <rect x="390" y="695" width="190" height="24" fill="#cbd5e0" stroke="#52657a" stroke-width="2"/>
    <path d="M408,680 L430,680 L430,645 L408,645 Z" class="panel"/>
    <path d="M540,680 L562,680 L562,645 L540,645 Z" class="panel"/>
    <circle cx="555" cy="705" r="8" fill="#f8d7da" stroke="#bd3030"/>
    <text x="485" y="744" class="label" text-anchor="middle">04｜A22 防错托座/到位开关</text>
  </g>
  <line x1="610" y1="692" x2="790" y2="655" class="explode"/>

  <!-- 05 cartridge -->
  <g id="cartridge">
    <rect x="340" y="205" width="260" height="290" fill="#eaf8fb" stroke="#16869b" stroke-width="4" rx="5"/>
    <rect x="362" y="228" width="216" height="244" fill="url(#sand)" stroke="#8b6a3e" stroke-width="2"/>
    <rect x="362" y="228" width="216" height="24" fill="#f5f8fb"/>
    <line x1="362" y1="252" x2="578" y2="252" stroke="#675038" stroke-width="2"/>
    <circle cx="470" cy="302" r="9" class="port1"/>
    <circle cx="470" cy="367" r="9" class="port2"/>
    <circle cx="470" cy="432" r="9" class="port3"/>
    <rect x="347" y="212" width="13" height="13" fill="#172334"/>
    <rect x="580" y="212" width="13" height="13" fill="#172334"/>
    <rect x="347" y="475" width="13" height="13" fill="#172334"/>
    <rect x="580" y="475" width="13" height="13" fill="#172334"/>
    <text x="470" y="528" class="label" text-anchor="middle">05｜A23 快换透明沙芯</text>
    <text x="470" y="548" class="tiny" text-anchor="middle">固定 50 / 115 / 180 深度；三色背部快接</text>
  </g>
  <line x1="600" y1="350" x2="805" y2="405" class="explode"/>

  <!-- 06 backboard and lights -->
  <g id="optical-background">
    <rect x="610" y="255" width="210" height="270" fill="#fbfbf7" stroke="#7e8791" stroke-width="2"/>
    <circle cx="715" cy="330" r="11" fill="#ffffff" stroke="#2f80ed" stroke-width="3"/>
    <circle cx="715" cy="395" r="11" fill="#ffffff" stroke="#f2c94c" stroke-width="3"/>
    <circle cx="715" cy="460" r="11" fill="#ffffff" stroke="#eb5757" stroke-width="3"/>
    <rect x="585" y="275" width="14" height="220" class="optical"/>
    <rect x="831" y="275" width="14" height="220" class="optical"/>
    <text x="715" y="552" class="label" text-anchor="middle">06｜A32/A33 双灯 + 白背板</text>
  </g>
  <line x1="845" y1="390" x2="900" y2="410" class="explode"/>

  <!-- 07 partition -->
  <g id="partition">
    <path d="M980,250 L1050,205 L1050,670 L980,715 Z" fill="#d7f1f4" fill-opacity="0.7" stroke="#16869b" stroke-width="3"/>
    <line x1="987" y1="265" x2="1043" y2="230" stroke="#ffffff" stroke-width="7" opacity="0.8"/>
    <text x="1007" y="740" class="label" text-anchor="middle">07｜A41 连续隔舱板</text>
  </g>
  <line x1="1050" y1="465" x2="1080" y2="465" class="explode"/>

  <!-- 08 electronics plate -->
  <g id="electronics">
    <rect x="1090" y="300" width="140" height="340" class="dry" rx="5"/>
    <rect x="1108" y="330" width="104" height="74" fill="#ffffff" stroke="#c27918" stroke-width="2" rx="5"/>
    <text x="1160" y="372" class="label" text-anchor="middle">RDK X5</text>
    <rect x="1108" y="430" width="104" height="60" fill="#ffffff" stroke="#c27918" stroke-width="2" rx="5"/>
    <text x="1160" y="465" class="small" text-anchor="middle">STM32F407</text>
    <rect x="1108" y="520" width="104" height="84" fill="#ffffff" stroke="#c27918" stroke-width="2" rx="5"/>
    <text x="1160" y="555" class="tiny" text-anchor="middle">USB Hub</text>
    <text x="1160" y="575" class="tiny" text-anchor="middle">DC/DC / 保险</text>
    <text x="1160" y="668" class="label" text-anchor="middle">08｜A42 干区电子板</text>
  </g>
  <line x1="1230" y1="470" x2="1270" y2="470" class="explode"/>

  <!-- 09 service door -->
  <g id="door">
    <rect x="1285" y="300" width="140" height="340" fill="#f4f5f7" stroke="#718096" stroke-width="3" rx="5"/>
    <circle cx="1355" cy="355" r="18" fill="#ffd9d9" stroke="#bd3030" stroke-width="2"/>
    <circle cx="1355" cy="425" r="12" fill="#57b86a" stroke="#256a33" stroke-width="2"/>
    <circle cx="1355" cy="475" r="12" fill="#f4f4f4" stroke="#5a6775" stroke-width="2"/>
    <path d="M1325,545 L1385,545 M1325,560 L1385,560 M1325,575 L1385,575" stroke="#718096" stroke-width="4"/>
    <text x="1355" y="668" class="label" text-anchor="middle">09｜A44 检修门/控制件</text>
  </g>

  <!-- 10 camera bridge -->
  <g id="camera-bridge">
    <path d="M180,165 L500,165 L550,135" fill="none" stroke="#6947a8" stroke-width="16"/>
    <path d="M180,165 L180,245" fill="none" stroke="#6947a8" stroke-width="16"/>
    <path d="M500,165 L500,245" fill="none" stroke="#6947a8" stroke-width="16"/>
    <rect x="312" y="180" width="56" height="34" class="optical" rx="6"/>
    <circle cx="340" cy="197" r="8" fill="#33285a"/>
    <text x="340" y="112" class="label" text-anchor="middle">10｜A13/A31 可拆光学桥 + UVC</text>
  </g>
  <line x1="550" y1="165" x2="690" y2="210" class="explode"/>

  <!-- flow direction and wet/dry warning -->
  <path d="M360,570 C500,580 560,480 650,430" fill="none" stroke="#16869b" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="485" y="575" class="small" fill="#16869b">三色支路接入沙芯背面</text>
  <path d="M1048,785 L1048,835" stroke="#bd3030" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="760" y="825" width="440" height="58" fill="#fff5f5" stroke="#bd3030" stroke-width="2" rx="8"/>
  <text x="980" y="850" class="label" fill="#8b1f1f" text-anchor="middle">湿/干红线：水箱、三泵、三色管和快接全部在隔板左侧</text>
  <text x="980" y="872" class="small" text-anchor="middle">仅电线可从 Z≥380 高位跨舱；水管不得越过电子板。</text>

  <!-- right legend -->
  <rect x="1230" y="100" width="340" height="820" fill="#ffffff" stroke="#d6dde7" stroke-width="2" rx="10"/>
  <text x="1260" y="140" class="section">装配顺序与检查点</text>

  <g transform="translate(1260,175)">
    <circle cx="18" cy="0" r="15" class="num"/><text x="18" y="5" class="numtext">1</text>
    <text x="45" y="5" class="label">主框与隔舱副框</text>
    <text x="45" y="27" class="small">空间对角线差 ≤2；四脚调平。</text>

    <circle cx="18" cy="70" r="15" class="num"/><text x="18" y="75" class="numtext">2</text>
    <text x="45" y="75" class="label">隔板密封与接水盘</text>
    <text x="45" y="97" class="small">先做 0.5 L 泼水试验，再装电。</text>

    <circle cx="18" cy="140" r="15" class="num"/><text x="18" y="145" class="numtext">3</text>
    <text x="45" y="145" class="label">三泵水路滑板</text>
    <text x="45" y="167" class="small">一泵一层；泵停检查虹吸和串液。</text>

    <circle cx="18" cy="210" r="15" class="num"/><text x="18" y="215" class="numtext">4</text>
    <text x="45" y="215" class="label">托座与后止挡</text>
    <text x="45" y="237" class="small">观察面 Y=80±1；到位开关只证落座。</text>

    <circle cx="18" cy="280" r="15" class="num"/><text x="18" y="285" class="numtext">5</text>
    <text x="45" y="285" class="label">背板、灯与沙芯</text>
    <text x="45" y="307" class="small">三色快接复核；四角标记均可见。</text>

    <circle cx="18" cy="350" r="15" class="num"/><text x="18" y="355" class="numtext">6</text>
    <text x="45" y="355" class="label">电子板与高位穿线</text>
    <text x="45" y="377" class="small">实物转孔；USB 插拔空间 ≥55。</text>

    <circle cx="18" cy="420" r="15" class="num"/><text x="18" y="425" class="numtext">7</text>
    <text x="45" y="425" class="label">相机桥与光学校准</text>
    <text x="45" y="447" class="small">工作距 350±20；拆装后重算标记。</text>

    <circle cx="18" cy="490" r="15" class="num"/><text x="18" y="495" class="numtext">8</text>
    <text x="45" y="495" class="label">外板和人机件</text>
    <text x="45" y="517" class="small">急停切泵电源，不切 X5/F407。</text>
  </g>

  <rect x="1250" y="730" width="300" height="160" class="callout"/>
  <text x="1270" y="758" class="label">首件冻结前不得批量开料</text>
  <text x="1270" y="784" class="small">• 先量真实模块和插头包络</text>
  <text x="1270" y="808" class="small">• 先打样快接孔和密封垫</text>
  <text x="1270" y="832" class="small">• 先确认相机视场覆盖 ROI</text>
  <text x="1270" y="856" class="small">• 先做三支路单独排液测试</text>
  <text x="1270" y="880" class="small">• P1 单 Z 轴不进入本图主装</text>

  <rect x="40" y="940" width="1520" height="40" fill="#ffffff" stroke="#d6dde7" rx="8"/>
  <text x="60" y="965" class="small">运输拆分：核心机架｜光学桥｜沙芯｜水路滑板。恢复顺序固定并拍照留基准；不使用临时胶带承担结构或密封。</text>
</svg>
